name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "NovelAssist-${{ github.run_number }}.apk"

      - name: Publish it as a release (download this on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "NovelAssist-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Novel Assist (build ${{ github.run_number }})" \
            --latest \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}.

          **To install:** on your Android phone, tap **NovelAssist-${{ github.run_number }}.apk** below, then open it. If the phone asks, allow your browser to install apps. Newer builds install over older ones and keep your novels."
